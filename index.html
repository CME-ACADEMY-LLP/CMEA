<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>CMEA PAY ADVICE PORTAL</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>

<style>

body{
font-family:Segoe UI;
background:#f1f4f9;
padding:40px;
text-align:center;
}

.container{
background:white;
padding:35px;
max-width:700px;
margin:auto;
border-radius:10px;
box-shadow:0 5px 20px rgba(0,0,0,0.1);
}

h2{
margin-bottom:5px;
}

button{
padding:12px 25px;
font-size:16px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
margin-top:20px;
}

button:hover{
background:#1d4ed8;
}

#status{
margin-top:15px;
font-weight:600;
}

.progress{
width:100%;
background:#e5e7eb;
height:20px;
border-radius:5px;
margin-top:15px;
overflow:hidden;
}

.bar{
height:100%;
width:0%;
background:#22c55e;
}

</style>
</head>

<body>

<div class="container">

<h2>CMEA PAY ADVICE RENAME</h2>

<p>Upload PDF (Max 200 Pages)</p>

<input type="file" id="pdfFile" accept="application/pdf">

<br>

<button onclick="processPDF()">Start Processing</button>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div id="status"></div>

</div>

<script>

async function processPDF(){

const fileInput=document.getElementById("pdfFile");
const status=document.getElementById("status");
const bar=document.getElementById("bar");

if(!fileInput.files.length){
alert("Please upload a PDF");
return;
}

const file=fileInput.files[0];
const buffer=await file.arrayBuffer();

const pdf=await pdfjsLib.getDocument({data:buffer}).promise;

const total=pdf.numPages;

if(total>200){
alert("Maximum 200 pages allowed");
return;
}

const zip=new JSZip();
const errorZip=new JSZip();

const nameCount={};

let errorPages=[];

for(let i=1;i<=total;i++){

status.innerText="Processing page "+i+" of "+total;

bar.style.width=(i/total*100)+"%";

try{

const page=await pdf.getPage(i);
const text=await page.getTextContent();

let content=text.items.map(x=>x.str).join(" ");

let nameMatch=content.match(/Beneficiary\s*Code\s*Name\s*:?\s*([A-Z\s]+)/i);

if(!nameMatch){

errorPages.push(i);

const original=await PDFLib.PDFDocument.load(buffer);
const newDoc=await PDFLib.PDFDocument.create();

const [p]=await newDoc.copyPages(original,[i-1]);
newDoc.addPage(p);

const bytes=await newDoc.save();

errorZip.file("Page "+i+".pdf",bytes);

continue;

}

let name=nameMatch[1].trim();

name=name.replace(/\s+/g," ");

if(nameCount[name]){

nameCount[name]++;

name=name+" ("+nameCount[name]+")";

}else{

nameCount[name]=1;

}

const original=await PDFLib.PDFDocument.load(buffer);
const newDoc=await PDFLib.PDFDocument.create();

const [p]=await newDoc.copyPages(original,[i-1]);
newDoc.addPage(p);

const bytes=await newDoc.save();

zip.file(name+".pdf",bytes);

}catch(err){

errorPages.push(i);

}

}

status.innerText="Creating ZIP files...";

const mainZip=await zip.generateAsync({type:"blob"});

saveAs(mainZip,"Renamed PDFs.zip");

if(errorPages.length>0){

const errZip=await errorZip.generateAsync({type:"blob"});

saveAs(errZip,"Error Pages.zip");

alert("Some pages had errors: "+errorPages.join(", "));

}

status.innerText="Completed Successfully";

}

</script>

</body>
</html>
